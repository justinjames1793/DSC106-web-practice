<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
    <script type="module" src="main.js"></script>
</head>
<body>
    <h1>Meta</h1>
    <p>This page includes stats about the code of this website.</p>

    <div id="stats"></div>

    <h2>Commits by time of day</h2>
    <!-- Scrollytelling (Lab 8, Step 3): story text on the left, sticky chart on the right.
         The .step divs in #scatter-story are generated in main.js, one per commit. -->
    <div id="scrolly-1">
      <div id="scatter-story"></div>
      <div id="scatter-plot">
        <div id="chart"></div>

        <p id="selection-count">No commits selected</p>
        <dl id="language-breakdown" class="stats"></dl>
      </div>
    </div>

    <!-- Info about the hovered commit (filled in by renderTooltipContent in main.js) -->
    <dl id="commit-tooltip" class="info tooltip" hidden>
      <dt>Commit</dt>
      <dd>
        <a href="" id="commit-link" target="_blank"></a>
      </dd>

      <dt>Date</dt>
      <dd id="commit-date"></dd>

      <dt>Time</dt>
      <dd id="commit-time"></dd>

      <dt>Author</dt>
      <dd id="commit-author"></dd>

      <dt>Lines edited</dt>
      <dd id="commit-lines"></dd>
    </dl>

    <!-- Scrollytelling part 2 (Lab 8, Step 4): same layout as the scatter plot's,
         story on the left and the file-size dots on the right. -->
    <div id="scrolly-2">
      <div id="files-story"></div>
      <div id="files-plot">
        <!-- Unit vis: one dot per line of code, grouped by file (Lab 8, Step 2).
             Filled in by updateFileDisplay() in main.js. Each file becomes:
             <div><dt><code>name</code><small>N lines</small></dt><dd><div class="loc"></div>...</dd></div> -->
        <dl id="files"></dl>
      </div>
    </div>
</body>
</html>
